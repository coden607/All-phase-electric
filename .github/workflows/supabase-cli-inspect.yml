name: Supabase CLI Inspect

on:
  workflow_dispatch:
  push:
    branches:
      - feat/build-all-phase-intake
    paths:
      - ".github/workflows/supabase-cli-inspect.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Show Supabase CLI version
        run: npx supabase --version
      - name: Show projects list help
        run: npx supabase projects list --help
      - name: List accessible projects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in this repository."
            exit 2
          fi
          npx supabase projects list
