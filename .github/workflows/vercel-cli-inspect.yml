name: Vercel CLI Inspect

on:
  workflow_dispatch:
  push:
    branches:
      - feat/build-all-phase-intake
    paths:
      - ".github/workflows/vercel-cli-inspect.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Vercel auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel@latest --version
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured in this repository."
            exit 2
          fi
          npx vercel whoami --token "$VERCEL_TOKEN"
