name: Demo CI

on:
  push:
    branches:
      - feat/demo-mvp
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash -n scripts/deploy-preview.sh
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
